name: Continuous Integration

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "**"

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        version: [22]
    runs-on: ${{ matrix.os }}
    environment: staging
    steps:
      - name: Checkout project
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Install Doppler CLI for env (public) variables
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: ${{ matrix.version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - run: pnpm run ci
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_CI_ENV_TOKEN }}

      - name: Verify published plugin packages
        run: pnpm test:plugin-packages

      - name: Verify packaged CLI WASM fallback
        run: pnpm --filter @inlang/cli test:package
